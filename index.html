 existing.priority=existing.priority||sm.priority;
 existing.createdAt=existing.createdAt||sm.createdAt;
 existing.objectives=sm.objectives.map(so=>{
   let po=previousByName.get(normMissionName(so.name));
   return {...clone(so),done:po?!!po.done:!!so.done,notes:(po&&po.notes)||so.notes};
 });
 existing.status=existing.objectives.every(o=>o.done)?"Complete":existing.objectives.some(o=>o.done)?"Active":sm.status;
 return existing;
}
function load(){
 try{
   let old=JSON.parse(localStorage.getItem(KEY)||"null");
   if(!old)return clone(defaultState);
   let s={...clone(defaultState),...old};
   s.missions=Array.isArray(old.missions)?old.missions:[];
   const claimed=new Set();
   for(const sm of seedMissions){
     let aliases=new Set([normMissionName(sm.name),...(missionAliases[sm.id]||[]).map(normMissionName)]);
     let idx=s.missions.findIndex((m,i)=>!claimed.has(i)&&(m.id===sm.id||aliases.has(normMissionName(m.name))));
     if(idx>=0){s.missions[idx]=mergeBuiltIn(s.missions[idx],sm);claimed.add(idx)}
     else{s.missions.push(clone(sm))}
   }
   return s;
 }catch(e){console.error("NMSCC migration recovery",e);return clone(defaultState)}
}
let S=load(),view="missions",selected="returned",missionOpen=false,filter="All",search="",draft=null;
function save(){localStorage.setItem(KEY,JSON.stringify(S));render()}
function pct(m){let a=m.objectives||[];return a.length?Math.round(a.filter(o=>o.done).length/a.length*100):(m.status==="Complete"?100:0)}
function status(m){if((m.objectives||[]).length){let p=pct(m);return p===100?"Complete":p>0?"Active":(m.status||"Planned")}return m.status||"Planned"}
function cls(p){return String(p||"Medium").toLowerCase()}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function sortedObjectives(m){return [...(m.objectives||[])]}
function nav(){let items=[["command","DASHBOARD"],["missions","MISSIONS"],["assets","ASSETS"],["fleet","FLEET"],["empire","EMPIRE"],["knowledge","KNOWLEDGE"],["data","DATA"]];for(let id of ["desktopNav","mobileNav"]){document.getElementById(id).innerHTML=items.map(([k,l])=>`<button class="${view===k?"active":""}" onclick="view='${k}';missionOpen=false;render()">${l}</button>`).join("")}}
function selectMission(id){selected=id;missionOpen=true;render();window.scrollTo(0,0)}
function closeMissionDetail(){missionOpen=false;render();window.scrollTo(0,0)}
function missionList(){let a=S.missions.filter(m=>(filter==="All"||status(m)===filter)&&(!search||m.name.toLowerCase().includes(search.toLowerCase())));return a.map(m=>`<div class="mission ${selected===m.id?"selected":""}" onclick="selectMission('${m.id}')"><div><h3>${esc(m.name)}</h3><div class="sub">${esc(m.description||"")}</div><div class="bar"><i style="width:${pct(m)}%"></i></div><div class="sub">${(m.objectives||[]).filter(o=>o.done).length}/${(m.objectives||[]).length} objectives</div></div><span class="badge ${status(m)==="Complete"?"complete":cls(m.priority)}">${esc(status(m)==="Complete"?"Completed":m.priority)}</span></div>`).join("")}
function missions(){
 let m=S.missions.find(x=>x.id===selected)||S.missions[0];if(m)selected=m.id;
 if(missionOpen&&m)return missionDetail(m,true);
 return `<section class="panel mission-list-page"><div class="row"><div><div class="title">MISSIONS</div><div class="sub">Plan, track and complete your No Man's Sky journey.</div></div><button class="btn primary" onclick="openEditor(null)">+ CREATE MISSION</button></div><div class="filters">${["All","Active","Complete","Planned"].map(x=>`<button class="${filter===x?"active":""}" onclick="filter='${x}';render()">${x}</button>`).join("")}</div><input class="search" placeholder="Search missions..." value="${esc(search)}" oninput="search=this.value;render()">${missionList()}</section>`;
}
function missionDetail(m,subpage=false){
 let objs=sortedObjectives(m),done=(m.objectives||[]).filter(o=>o.done).length;
 return `<section id="missionDetail" class="panel mission-subpage">
 <div class="mission-sub-head"><button class="back-btn" onclick="closeMissionDetail()">‹ <span>BACK</span></button><div class="mission-top-actions"><button class="btn primary" onclick="openEditor('${m.id}')">✎ EDIT MISSION</button><button class="btn danger icon-delete" onclick="deleteMission('${m.id}')">🗑</button></div></div>
 <h2>${esc(m.name)}</h2>
 <div class="mission-meta"><span class="badge ${status(m)==="Complete"?"complete":"low"}">${status(m)}</span><span class="badge ${cls(m.priority)}">${esc(m.priority)} PRIORITY</span><span class="badge">${done}/${(m.objectives||[]).length} COMPLETE</span></div>
 <div class="sub mission-desc">${esc(m.description||"")}</div>
 <div class="mission-progress"><div class="bar"><i style="width:${pct(m)}%"></i></div><strong>${pct(m)}%</strong></div>
 <div class="tabs mission-tabs"><button class="active">OBJECTIVES (${done}/${(m.objectives||[]).length})</button><button onclick="alert(${JSON.stringify(m.notes||"No mission notes.")})">NOTES</button><button onclick="alert('Mission priority: ${esc(m.priority)}\\nStatus: ${status(m)}')">DETAILS</button></div>
 <div class="objective-list">${objs.map((o,i)=>`<div class="objective ${o.done?"done":""}"><input type="checkbox" ${o.done?"checked":""} onchange="toggleObj('${m.id}','${esc(o.name)}',this.checked)"><div><b class="otext">${i+1}. ${esc(o.name)}</b><div class="sub">${esc(o.notes||"")}</div></div></div>`).join("")}</div>
 <div class="hint">Objectives follow the mission's progression order. Completed objectives remain in their correct place. Priority applies to missions only.</div>
 </section>`;
}
function toggleObj(mid,name,val){let m=S.missions.find(x=>x.id===mid),o=m?.objectives.find(x=>x.name===name);if(o){o.done=val;m.status=pct(m)===100?"Complete":pct(m)>0?"Active":"Planned";save()}}
function generic(title,body){return `<section class="panel"><div class="title">${title}</div>${body}</section>`}
function missionRank(m){return priorityOrder[m.priority]??9}
function nextObjective(m){return (m.objectives||[]).find(o=>!o.done)||null}
function overallProgress(){let a=S.missions.flatMap(m=>m.objectives||[]),d=a.filter(o=>o.done).length;return{done:d,total:a.length,pct:a.length?Math.round(d/a.length*100):0}}
function currentOperation(){return S.missions.filter(m=>status(m)==="Active").sort((a,b)=>missionRank(a)-missionRank(b)||a.createdAt-b.createdAt)[0]||null}
function missionCounts(){let c={Critical:0,High:0,Medium:0,Low:0,Optional:0,Complete:0};S.missions.forEach(m=>status(m)==="Complete"?c.Complete++:c[m.priority]++);return c}
function objectiveDone(mid,name){let m=S.missions.find(x=>x.id===mid);return !!m?.objectives?.find(o=>normMissionName(o.name)===normMissionName(name))?.done}
function dashboardGoMission(id){view="missions";selected=id;missionOpen=true;render();window.scrollTo(0,0)}
function quickUpdate(field,label){let v=prompt(`Update ${label}`,S[field]??0);if(v!==null&&v.trim()!==""&&!isNaN(Number(v))){S[field]=Number(v);save()}}
function command(){
 let op=overallProgress(),cur=currentOperation(),c=missionCounts(),next=cur?nextObjective(cur):null;
 let station=S.missions.find(m=>m.id==="station"),fleetm=S.missions.find(m=>m.id==="fleet"),settlement=S.missions.find(m=>m.id==="settlement"),corvette=S.missions.find(m=>m.id==="corvette"),mould=S.missions.find(m=>m.id==="mould");
 let g=objectiveDone("station","Acquire Gravitino Coil"),t=objectiveDone("station","Acquire Corvette Tractor Beam"),race=objectiveDone("station","Build local race standing"),guild=objectiveDone("station","Build relevant Guild standing"),salv=objectiveDone("station","Develop Cosmos salvage capability"),freighter=objectiveDone("fleet","Own a freighter");
 let alerts=[];if(S.units<250000000)alerts.push("Next capital milestone: 250M Units");if(!t)alerts.push("Acquire Corvette Tractor Beam");if(!salv)alerts.push("Develop salvage capability");if(mould&&status(mould)!=="Complete")alerts.push("Establish a Nanite farm");
 let milestones=[["Reach 120M Units",objectiveDone("station","Reach 120M Units")],["Acquire Gravitino Coil",g],["Complete The Purge",objectiveDone("purge","Complete The Purge")],["Unlock all 16 Glyphs",objectiveDone("glyphs","Obtain all 16 Portal Glyphs")]].filter(x=>x[1]);
 return `<section class="dashboard-page">
 <div class="panel dash-hero"><div class="title">COMMAND DASHBOARD</div><div class="dash-stat-grid">
 <div class="dash-stat"><strong>${(S.units/1e6).toFixed(1)}M</strong><span>UNITS</span></div><div class="dash-stat"><strong>${S.nanites||0}</strong><span>NANITES</span></div>
 <div class="dash-stat"><strong>${S.glyphs||0}/16</strong><span>GLYPHS</span></div><div class="dash-stat"><strong>${S.frigates||0}/30</strong><span>FRIGATES</span></div></div></div>
 <div class="panel"><div class="dash-title">OVERALL PROGRESS</div><div class="dash-progress"><div class="bar"><i style="width:${op.pct}%"></i></div><b>${op.pct}%</b></div><div class="sub">${op.done} / ${op.total} objectives complete</div></div>
 ${cur?`<button class="panel dash-operation" onclick="dashboardGoMission('${cur.id}')"><div class="dash-title">CURRENT OPERATION</div><div class="row"><strong>${esc(cur.name)}</strong><b class="chev">›</b></div><div class="dash-progress"><div class="bar"><i style="width:${pct(cur)}%"></i></div><b>${pct(cur)}%</b></div><div class="sub">Next objective:</div><div>${esc(next?.name||"Mission complete")}</div></button>`:""}
 <div class="dash-two"><div class="panel"><div class="dash-title">MISSION STATUS</div><div class="dash-lines">
 ${["Critical","High","Medium","Low","Optional"].map(x=>`<span><i class="dot ${x.toLowerCase()}"></i>${x}<b>${c[x]}</b></span>`).join("")}<span><i class="dot complete"></i>Completed<b>${c.Complete}</b></span></div></div>
 <div class="panel"><div class="dash-title">STAR STATION READINESS</div><div class="dash-lines">
 <span>Capital<b>${(S.units/1e6).toFixed(0)}M / ~1B+</b></span><span>Gravitino Coil<b class="${g?"ok":"pending"}">${g?"✓ Acquired":"○ Pending"}</b></span><span>Tractor Beam<b class="${t?"ok":"pending"}">${t?"✓ Acquired":"○ Not acquired"}</b></span>
 <span>Local Standing<b class="${race?"ok":"pending"}">${race?"✓ Ready":"○ In progress"}</b></span><span>Guild Standing<b class="${guild?"ok":"pending"}">${guild?"✓ Ready":"○ In progress"}</b></span><span>Salvage Capability<b class="${salv?"ok":"pending"}">${salv?"✓ Ready":"○ In progress"}</b></span></div></div></div>
 <div class="dash-two"><div class="panel"><div class="dash-title">EMPIRE OVERVIEW</div><div class="dash-lines">
 <span>Gold Mine<b class="ok">✓ Operational</b></span><span>Activated Indium<b class="ok">✓ Operational</b></span><span>Settlement<b class="pending">${settlement&&status(settlement)==="Complete"?"✓ Maxed":"◐ Developing"}</b></span>
 <span>Freighter<b class="${freighter?"ok":"pending"}">${freighter?"✓ Owned":"○ Not acquired"}</b></span><span>Corvette<b class="pending">${corvette&&status(corvette)==="Complete"?"✓ Complete":"◐ Developing"}</b></span><span>Star Station<b class="pending">${station&&status(station)==="Complete"?"✓ Acquired":"○ Not acquired"}</b></span></div></div>
 <div class="panel"><div class="dash-title">FLEET OVERVIEW</div><div class="dash-lines"><span>Frigates<b>${S.frigates||0} / 30</b></span><span>Freighter<b class="${freighter?"ok":"pending"}">${freighter?"✓ Owned":"○ Not acquired"}</b></span><span>Fleet Development<b>${fleetm?pct(fleetm):0}%</b></span><span>Next Objective<b class="small">${esc(nextObjective(fleetm||{objectives:[]})?.name||"—")}</b></span></div></div></div>
 <div class="dash-two"><div class="panel"><div class="dash-title">RECENT MILESTONES</div><div class="dash-lines">${milestones.map(x=>`<span><i class="checkdot">✓</i>${esc(x[0])}</span>`).join("")}</div></div>
 <div class="panel"><div class="dash-title">COMMAND ALERTS</div><div class="dash-lines">${alerts.map((x,i)=>`<span><i class="alertdot ${i?"high":"critical"}"></i>${esc(x)}</span>`).join("")||'<span class="ok">✓ No immediate alerts</span>'}</div></div></div>
 <div class="panel"><div class="dash-title">QUICK ACTIONS</div><div class="quick-actions"><button class="btn" onclick="quickUpdate('units','Units')">Update Units</button><button class="btn" onclick="quickUpdate('nanites','Nanites')">Update Nanites</button><button class="btn" onclick="view='missions';missionOpen=false;render();openEditor(null)">+ Create Mission</button><button class="btn" onclick="view='missions';missionOpen=false;render()">View Missions</button></div></div>
 </section>`}
function assets(){return generic("ASSETS",`<div class="cards">${S.ships.map(x=>`<div class="card"><b>${esc(x.name)}</b><div class="sub">${esc(x.class)}-Class · ${esc(x.notes)}</div></div>`).join("")}${S.mines.map(x=>`<div class="card"><b>${esc(x.name)}</b><div class="sub">${esc(x.class)}-Class · ${esc(x.status)}</div></div>`).join("")}</div>`)}
function fleet(){return generic("FLEET",`<div class="card"><b>Freighter Command</b><div class="sub">Freighter owned. Develop frigate roster toward 30 capacity.</div></div>`)}
function empire(){return generic("EMPIRE",`<div class="cards"><div class="card"><b>Settlement</b><div class="sub">Development mission tracked in Mission Control.</div></div><div class="card"><b>Star Station Project</b><div class="sub">${(S.units/1e6).toFixed(1)}M / ~1B+ planning reserve</div></div><div class="card"><b>Gold Mine</b><div class="sub">S-Class · Operational</div></div><div class="card"><b>Activated Indium Mine</b><div class="sub">B-Class · Operational</div></div></div>`)}
function knowledge(){return generic("KNOWLEDGE CORE",`<div class="card"><b>Universal NMS Knowledge</b><div class="sub">The universal reference database remains a core NMSCC system. This rebuild preserves the section while the database continues to be expanded.</div></div>`)}
function data(){return generic("DATA",`<div class="cards"><div class="card"><label>Units</label><input class="search" type="number" value="${S.units}" onchange="S.units=+this.value;save()"></div><div class="card"><label>Nanites</label><input class="search" type="number" value="${S.nanites}" onchange="S.nanites=+this.value;save()"></div></div><div style="margin-top:12px"><button class="btn" onclick="exportData()">EXPORT JSON</button> <button class="btn" onclick="document.getElementById('imp').click()">IMPORT JSON</button><input id="imp" type="file" accept=".json" hidden onchange="importData(this.files[0])"></div>`)}
function render(){nav();let routes={command,missions,assets,fleet,empire,knowledge,data};document.getElementById("app").innerHTML=(routes[view]||missions)();document.getElementById("unitstat").textContent=(S.units/1e6).toFixed(1)+"M Units";document.getElementById("nanstat").textContent=(S.nanites||0)+" Nanites"}
function opts(v){return ["Critical","High","Medium","Low","Optional"].map(x=>`<option ${x===v?"selected":""}>${x}</option>`).join("")}
function openEditor(id){let m=id?S.missions.find(x=>x.id===id):null;draft=m?clone(m):{id:"m"+Date.now(),name:"",description:"",priority:"Medium",status:"Planned",notes:"",createdAt:Date.now(),objectives:[]};draft._editing=!!m;drawEditor()}
function drawEditor(){document.getElementById("modal")?.remove();let d=document.createElement("div");d.id="modal";d.className="modalbg";d.innerHTML=`<div class="modal"><div class="row"><div><div class="title">${draft._editing?"EDIT MISSION":"CREATE MISSION"}</div><div class="sub">${draft._editing?"Modify mission details and manage existing objectives.":"Add a new mission and set up its objectives."}</div></div><button class="btn" onclick="closeEditor()">×</button></div><div class="formgrid"><div><label class="field">MISSION NAME *</label><input id="en" value="${esc(draft.name)}"></div><div><label class="field">MISSION PRIORITY</label><select id="ep">${opts(draft.priority)}</select></div></div><label class="field">DESCRIPTION</label><textarea id="ed">${esc(draft.description)}</textarea><label class="field">MISSION NOTES</label><textarea id="enn">${esc(draft.notes)}</textarea><div class="row"><div class="title" style="font-size:17px">OBJECTIVES</div><button class="btn primary" onclick="addDraftObj()">+ ADD OBJECTIVE</button></div><div class="sub">Objectives are completed in the order shown. Use the arrows to keep them in the correct progression sequence.</div><div id="eobjs">${draftObjs()}</div><div class="actions">${draft._editing?`<button class="btn danger" onclick="deleteMission('${draft.id}')">DELETE MISSION</button>`:""}<button class="btn" onclick="closeEditor()">CANCEL</button><button class="btn primary" onclick="saveEditor()">${draft._editing?"SAVE CHANGES":"CREATE MISSION"}</button></div></div>`;document.body.appendChild(d)}
function draftObjs(){return draft.objectives.map((o,i)=>`<div class="objedit objective-editor-row"><input value="${esc(o.name)}" placeholder="Objective" oninput="draft.objectives[${i}].name=this.value"><button class="btn del danger" onclick="draft.objectives.splice(${i},1);drawEditor()">DELETE</button><input style="grid-column:1/-1" value="${esc(o.notes||"")}" placeholder="Objective notes" oninput="draft.objectives[${i}].notes=this.value"><div style="grid-column:1/-1"><button class="btn" onclick="moveDraft(${i},-1)">↑</button> <button class="btn" onclick="moveDraft(${i},1)">↓</button></div></div>`).join("")||`<div class="hint">No objectives yet. Add your first objective to get started.</div>`}
function syncEditor(){if(!draft)return;let g=x=>document.getElementById(x);draft.name=g("en")?.value||draft.name;draft.priority=g("ep")?.value||draft.priority;draft.description=g("ed")?.value||"";draft.notes=g("enn")?.value||""}
function addDraftObj(){syncEditor();draft.objectives.push({name:"",notes:"",done:false});drawEditor()}
function moveDraft(i,d){syncEditor();let j=i+d;if(j<0||j>=draft.objectives.length)return;[draft.objectives[i],draft.objectives[j]]=[draft.objectives[j],draft.objectives[i]];drawEditor()}
function saveEditor(){syncEditor();if(!draft.name.trim())return alert("Enter a mission name.");draft.objectives=draft.objectives.filter(o=>o.name.trim());let edit=draft._editing;delete draft._editing;if(edit){let i=S.missions.findIndex(x=>x.id===draft.id);S.missions[i]=draft}else S.missions.unshift(draft);selected=draft.id;draft=null;document.getElementById("modal")?.remove();save()}
function closeEditor(){draft=null;document.getElementById("modal")?.remove()}
function deleteMission(id){if(!confirm("Delete this mission?"))return;S.missions=S.missions.filter(x=>x.id!==id);selected=S.missions[0]?.id;missionOpen=false;closeEditor();save()}
function exportData(){let b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="NMSCC-backup.json";a.click();URL.revokeObjectURL(a.href)}
function importData(f){if(!f)return;let r=new FileReader;r.onload=()=>{try{S={...clone(defaultState),...JSON.parse(r.result)};save()}catch(e){alert("Invalid NMSCC backup.")}};r.readAsText(f)}
render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
