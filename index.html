<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07131d">
<link rel="manifest" href="./manifest.webmanifest">
<title>NMS Command Centre V5</title>
<style>
:root{--bg:#050a0f;--panel:#0c1720;--panel2:#101f2b;--line:#203745;--txt:#eaf7ff;--muted:#88a6b8;--cyan:#38d9ff;--green:#4cf0a5;--amber:#ffc857;--red:#ff6b7a}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07131d,#050a0f 35%);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:88px}
header{position:sticky;top:0;z-index:5;padding:16px;background:#07131deF;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
h1{font-size:19px;margin:0;letter-spacing:.08em}header small{color:var(--cyan)}
main{max-width:900px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:11px}
.stat b{display:block;font-size:22px;color:var(--cyan)}.stat span,.muted{color:var(--muted);font-size:12px}
h2{font-size:14px;letter-spacing:.09em;color:var(--cyan);margin:5px 0 12px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:8px 0}
button,input,textarea,select{font:inherit}button{background:#132a38;color:var(--txt);border:1px solid #285064;border-radius:10px;padding:9px 11px}button.primary{border-color:var(--cyan);color:var(--cyan)}button.danger{color:var(--red)}
input,textarea,select{width:100%;background:#071119;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:10px;margin:4px 0}textarea{min-height:80px;resize:vertical}
.item{padding:10px;border:1px solid var(--line);border-radius:11px;margin:7px 0}.item b{font-size:14px}.item small{display:block;color:var(--muted);margin-top:3px}
.progress{height:7px;background:#071119;border-radius:9px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--green)}
.alert{border-left:3px solid var(--amber);padding-left:10px;margin:9px 0;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#07131df5;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav button{border:0;background:none;padding:8px 2px;font-size:9px;color:var(--muted)}nav button.active{color:var(--cyan)}
.page{display:none}.page.active{display:block}.pill{font-size:11px;padding:3px 7px;border:1px solid var(--line);border-radius:20px;color:var(--green)}
.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{font-size:12px;padding:6px 8px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header><h1>ATLAS // NMS COMMAND CENTRE</h1><small>V5 • Traveller Operations Terminal</small></header>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const KEY="nmscc3";
const defaults={
 units:120000000,nanites:0,quicksilver:0,voidMotes:0,glyphs:16,galaxies:2,
 missions:[
  {name:"They Who Returned",status:"ACTIVE",progress:35,notes:"Continue Autophage storyline; unlock full Autophage access and Void Motes."},
  {name:"Autophage Staff",status:"PLANNED",progress:0,notes:"Earn Void Motes, acquire staff components and assemble Voltaic Staff."},
  {name:"Construction Blueprints",status:"IN PROGRESS",progress:20,notes:"Unlock every construction blueprint."},
  {name:"Base Specialist Missions",status:"IN PROGRESS",progress:10,notes:"Complete Overseer, Scientist, Armourer, Farmer and Technician chains."},
  {name:"Max Settlement",status:"IN PROGRESS",progress:15,notes:"Develop settlement to maximum practical class/productivity/happiness."},
  {name:"Star Station Project",status:"END GOAL",progress:5,notes:"Build standing, salvage capability and capital; inspect candidate Station Cores."}
 ],
 ships:[{name:"Embers Defender TB4",class:"A",role:"Main Starship",details:"Damage 398.0 • Shield 210.9 • Hyperdrive 347.0 • Manoeuvrability 432.0"}],
 tools:[
  {name:"S-Class Weapon Multi-Tool",class:"S",role:"Weapon reserve",details:"Acquired at system station; not intended as main Multi-Tool."},
  {name:"Experimental Multi-Tool",class:"S",role:"Scanner",details:"PLANNED • Optimize scanner modules and supercharged slots."}
 ],
 frigates:[],
 mines:[
  {name:"Gold Mine",status:"OPERATIONAL",details:"S-Class hotspot • independent extraction networks."},
  {name:"Activated Indium Mine",status:"OPERATIONAL",details:"B-Class hotspot • scalable independent networks."},
  {name:"Runaway Mould Farm",status:"PLANNED",details:"Curious Deposits → Runaway Mould → Nanites."}
 ],
 bases:[],
 freighter:"Freighter owned. Develop fleet, storage, Matter Beam and fleet technology.",
 corvette:"Corvette under development. Medium combat/exploration flagship concept. Tractor Beam planned.",
 settlement:"Settlement owned. Goal: maximize productivity, happiness, buildings and class.",
 station:"End goal: own and develop a Star Station. Build standing, salvage capability and ~1B+ Unit acquisition reserve.",
 notes:""
};
let old={};try{old=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
let S=Object.assign({},defaults,old);
["missions","ships","tools","frigates","mines","bases"].forEach(k=>{if(!Array.isArray(S[k]))S[k]=defaults[k]});
function save(){localStorage.setItem(KEY,JSON.stringify(S));render()}
function money(n){n=Number(n)||0;return n>=1e9?(n/1e9).toFixed(2)+"B":n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(1)+"K":String(n)}
const tabs=[["command","COMMAND"],["missions","MISSIONS"],["assets","ASSETS"],["fleet","FLEET"],["empire","EMPIRE"],["data","DATA"]];
let tab="command";
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function setField(k,v){S[k]=["units","nanites","quicksilver","voidMotes","glyphs","galaxies"].includes(k)?Number(v):v;save()}
function list(k,title,fields){
 return `<div class="card"><div class="row"><h2>${title}</h2><button onclick="addRec('${k}')">+ ADD</button></div>`+
 S[k].map((x,i)=>`<div class="item"><div class="row"><b>${esc(x.name)}</b><span class="pill">${esc(x.class||x.status||x.role||"")}</span></div><small>${esc(x.role||"")}${x.role&&x.details?" • ":""}${esc(x.details||x.notes||"")}</small><div class="actions"><button onclick="editRec('${k}',${i})">EDIT</button><button class="danger" onclick="delRec('${k}',${i})">DELETE</button></div></div>`).join("")+"</div>"
}
function command(){
 let mp=S.missions.length?Math.round(S.missions.reduce((a,m)=>a+(Number(m.progress)||0),0)/S.missions.length):0;
 let stationFund=Math.min(100,Math.round((Number(S.units)||0)/10000000));
 return `<section class="page active"><div class="grid">
 <div class="card stat"><b>${money(S.units)}</b><span>UNITS</span></div><div class="card stat"><b>${money(S.nanites)}</b><span>NANITES</span></div>
 <div class="card stat"><b>${S.glyphs}/16</b><span>GLYPHS</span></div><div class="card stat"><b>${S.frigates.length}/30</b><span>FRIGATES</span></div></div>
 <div class="card"><h2>ACTIVE OPERATION</h2><b>They Who Returned</b><div class="progress"><i style="width:${mp}%"></i></div><small class="muted">Overall mission-board progress ${mp}%</small></div>
 <div class="card"><h2>COMMAND ALERTS</h2>
 <div class="alert">Continue <b>They Who Returned</b> → unlock full Autophage access and Staff progression.</div>
 <div class="alert">Establish permanent <b>Runaway Mould Nanite Farm</b>.</div>
 <div class="alert">Fleet capacity: <b>${S.frigates.length}/30</b> registered frigates.</div>
 <div class="alert">Star Station acquisition reserve: <b>${money(S.units)}</b> / planning target ~1B+ Units.</div></div>
 <div class="card"><h2>STAR STATION FUND</h2><div class="progress"><i style="width:${stationFund}%"></i></div><small class="muted">${stationFund}% of 1B Unit planning reserve</small></div></section>`
}
function missions(){return `<section class="page active"><div class="card"><div class="row"><h2>MISSION CONTROL</h2><button onclick="addMission()">+ MISSION</button></div>`+
 S.missions.map((m,i)=>`<div class="item"><div class="row"><b>${esc(m.name)}</b><span class="pill">${esc(m.status)}</span></div><small>${esc(m.notes)}</small><div class="progress"><i style="width:${Number(m.progress)||0}%"></i></div><small>${Number(m.progress)||0}% complete</small><div class="actions"><button onclick="editMission(${i})">EDIT</button><button class="danger" onclick="delMission(${i})">DELETE</button></div></div>`).join("")+"</div></section>"}
function assets(){return `<section class="page active">${list("ships","STARSHIP REGISTRY")}${list("tools","MULTI-TOOL ARMOURY")}<div class="card"><h2>CORVETTE PROJECT</h2><textarea onchange="setField('corvette',this.value)">${esc(S.corvette)}</textarea></div></section>`}
function fleet(){return `<section class="page active"><div class="card"><h2>FREIGHTER COMMAND</h2><textarea onchange="setField('freighter',this.value)">${esc(S.freighter)}</textarea></div>${list("frigates","FRIGATE FLEET")}</section>`}
function empire(){return `<section class="page active">${list("mines","INDUSTRIAL NETWORK")}${list("bases","BASE / GALAXY REGISTRY")}<div class="card"><h2>SETTLEMENT COMMAND</h2><textarea onchange="setField('settlement',this.value)">${esc(S.settlement)}</textarea></div><div class="card"><h2>STAR STATION PROJECT</h2><textarea onchange="setField('station',this.value)">${esc(S.station)}</textarea></div></section>`}
function data(){return `<section class="page active"><div class="card"><h2>ECONOMY</h2>
 ${field("units","Units",S.units)}${field("nanites","Nanites",S.nanites)}${field("quicksilver","Quicksilver",S.quicksilver)}${field("voidMotes","Void Motes",S.voidMotes)}
 ${field("glyphs","Portal Glyphs",S.glyphs)}${field("galaxies","Galaxies Established",S.galaxies)}</div>
 <div class="card"><h2>COMMAND NOTES</h2><textarea onchange="setField('notes',this.value)">${esc(S.notes)}</textarea></div>
 <div class="card"><h2>BACKUP / RESTORE</h2><div class="actions"><button class="primary" onclick="exportData()">EXPORT JSON</button><button onclick="document.getElementById('imp').click()">IMPORT JSON</button><input id="imp" type="file" accept=".json,application/json" style="display:none" onchange="importData(this)"></div><small class="muted">Export backups before clearing Safari data or moving devices.</small></div></section>`}
function field(k,l,v){return `<label class="muted">${l}</label><input type="number" value="${Number(v)||0}" onchange="setField('${k}',this.value)">`}
function render(){
 document.getElementById("app").innerHTML=({command:command,missions:missions,assets:assets,fleet:fleet,empire:empire,data:data}[tab])();
 document.getElementById("nav").innerHTML=tabs.map(t=>`<button class="${tab===t[0]?"active":""}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join("")
}
function addRec(k){let name=prompt("Name");if(!name)return;let role=prompt("Role / status","");let details=prompt("Details","");S[k].push({name,role,status:role,details});save()}
function editRec(k,i){let x=S[k][i];let name=prompt("Name",x.name);if(name===null)return;let role=prompt("Role / status",x.role||x.status||x.class||"");if(role===null)return;let details=prompt("Details",x.details||x.notes||"");if(details===null)return;Object.assign(x,{name,role,status:role,details});save()}
function delRec(k,i){if(confirm("Delete this record?")){S[k].splice(i,1);save()}}
function addMission(){let name=prompt("Mission name");if(!name)return;S.missions.push({name,status:"PLANNED",progress:0,notes:""});save()}
function editMission(i){let m=S.missions[i];let name=prompt("Mission name",m.name);if(name===null)return;let status=prompt("Status",m.status);if(status===null)return;let p=prompt("Progress 0-100",m.progress);if(p===null)return;let notes=prompt("Objective / notes",m.notes);if(notes===null)return;Object.assign(m,{name,status,progress:Math.max(0,Math.min(100,Number(p)||0)),notes});save()}
function delMission(i){if(confirm("Delete this mission?")){S.missions.splice(i,1);save()}}
function exportData(){let b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="NMS-Command-Centre-V5-backup.json";a.click();URL.revokeObjectURL(a.href)}
function importData(el){let f=el.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);S=Object.assign({},defaults,x);save();alert("Backup imported.")}catch(e){alert("Invalid backup file.")}};r.readAsText(f)}
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js");
</script>
</body></html>
