<style>
:root{--bg:#030b11;--panel:#0a1822;--panel2:#0d202c;--line:#1d3d50;--cyan:#27c9ff;--text:#e9f4ff;--muted:#88a5b9;--green:#31e59b;--red:#ff4051;--orange:#ff8b25;--yellow:#ffd429;--blue:#25aaff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#0d2a3d 0,#030b11 35%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}.shell{max-width:1500px;margin:auto;min-height:100vh}.top{height:92px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:16px 24px;justify-content:space-between;background:#06131de8;position:sticky;top:0;z-index:20}.brand h1{font-size:23px;letter-spacing:.08em;margin:0}.brand small{color:var(--cyan);letter-spacing:.25em}.stats{display:flex;gap:20px;color:#b9d8ed}.layout{display:grid;grid-template-columns:180px 1fr;min-height:calc(100vh - 92px)}nav{border-right:1px solid var(--line);padding:14px 8px;background:#06131d;position:sticky;top:92px;height:calc(100vh - 92px)}nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:13px 12px;color:#9eb8ce;border-radius:8px;margin:3px 0}nav button.active,nav button:hover{background:#0c3853;color:#fff;border-left:3px solid var(--cyan)}main{padding:16px}.grid{display:grid;grid-template-columns:minmax(350px,500px) minmax(460px,1fr);gap:14px}.panel{background:linear-gradient(145deg,#081722,#0b1d29);border:1px solid var(--line);border-radius:12px;padding:14px}.title{font-weight:850;font-size:21px;letter-spacing:.04em}.sub{color:var(--muted);font-size:13px}.row{display:flex;align-items:center;gap:8px;justify-content:space-between}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.filters button,.btn{border:1px solid #28536a;background:#0b1b26;border-radius:8px;padding:9px 12px}.btn.primary{border-color:var(--cyan);color:#8be5ff}.btn.danger{border-color:var(--red);color:#ff7580}.search{width:100%;background:#06121b;border:1px solid #28536a;border-radius:8px;padding:10px;margin:8px 0}.mission{display:grid;grid-template-columns:1fr auto;gap:8px;border:1px solid #18384b;border-radius:9px;padding:11px;margin:7px 0;background:#08151e}.mission.selected{border-color:var(--cyan);box-shadow:0 0 0 1px #0fa8df inset}.mission h3{margin:0 0 3px;color:#eaf6ff;font-size:15px}.badge{border:1px solid currentColor;border-radius:999px;padding:3px 9px;font-size:11px;white-space:nowrap}.critical{color:var(--red)}.high{color:var(--orange)}.medium{color:var(--yellow)}.low{color:var(--green)}.optional{color:#8aa5ba}.complete{color:var(--green)}.bar{height:6px;background:#07111a;border-radius:99px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--blue)}.detail h2{font-size:25px;margin:10px 0 4px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:15px 0}.tabs button{background:#07151f;border:1px solid #22465b;padding:10px;border-radius:7px}.tabs .active{border-color:var(--cyan)}.objective{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;border:1px solid #18384b;border-radius:8px;padding:10px;margin:6px 0}.objective input{width:19px;height:19px}.objective.done .otext{text-decoration:line-through;color:#7991a2}.hint{background:#0c2130;border:1px solid #275069;border-radius:8px;padding:10px;color:#9db9cc;font-size:12px;margin-top:12px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:#0a1924;border:1px solid var(--line);border-radius:10px;padding:14px}.modalbg{position:fixed;inset:0;background:#000b;z-index:100;display:flex;align-items:center;justify-content:center;padding:12px}.modal{width:min(760px,100%);max-height:92vh;overflow:auto;background:#091923;border:1px solid #2a5870;border-radius:15px;padding:18px}.formgrid{display:grid;grid-template-columns:1fr 180px;gap:10px}.field{display:block;color:var(--muted);font-size:12px;margin:10px 0 4px}.modal input,.modal select,.modal textarea{width:100%;background:#06131d;border:1px solid #28536a;border-radius:8px;padding:10px}.modal textarea{min-height:72px}.objedit{display:grid;grid-template-columns:1fr 140px auto;gap:7px;border:1px solid var(--line);padding:8px;border-radius:8px;margin:6px 0}.actions{display:flex;justify-content:flex-end;gap:8px;position:sticky;bottom:-18px;background:#091923;padding:12px 0 0}.mobilebar{display:none}
@media(max-width:900px){.top{height:auto}.stats{display:none}.layout{display:block}.grid{grid-template-columns:1fr}.detail{display:none}.detail.open{display:block}nav{display:none}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:#06131df5;border-top:1px solid var(--line);overflow-x:auto;padding-bottom:env(safe-area-inset-bottom)}.mobilebar button{min-width:94px;flex:1;border:0;background:transparent;color:#9eb8ce;padding:13px 8px}.mobilebar .active{color:var(--cyan)}main{padding-bottom:75px}.formgrid{grid-template-columns:1fr}.objedit{grid-template-columns:1fr 120px}.objedit .del{grid-column:2}.brand h1{font-size:18px}}
</style></head>
<body><div class="shell"><header class="top"><div class="brand"><h1>ATLAS // NMS COMMAND CENTRE</h1><small>EXPLORE · BUILD · COMPLETE · DOMINATE</small></div><div class="stats"><span id="shipstat">Embers Defender TB4</span><span id="unitstat">120.0M Units</span><span id="nanstat">0 Nanites</span></div></header>
<div class="layout"><nav id="desktopNav"></nav><main id="app"></main></div><div class="mobilebar" id="mobileNav"></div></div>
<script>
const KEY="nmscc3";
const priorityOrder={Critical:0,High:1,Medium:2,Low:3,Optional:4};
const seedMissions=[
{id:"returned",name:"They Who Returned",description:"Continue the Autophage storyline and gain full access to Autophage content.",priority:"Critical",status:"Active",notes:"Autophage storyline is your current active operation.",createdAt:Date.now()-9000,objectives:[

{name:"Locate Autophage Camps",notes:"Find and visit multiple Autophage camps.",priority:"High",done:false},
{name:"Collect Void Motes",notes:"Build a reserve through Autophage activities.",priority:"High",done:false},
{name:"Unlock Staff Component Access",notes:"Reach the point where staff parts can be acquired.",priority:"Medium",done:false}]},
{id:"staff",name:"Autophage Staff",description:"Obtain and develop your Voltaic Staff.",priority:"High",status:"Planned",notes:"Begins after sufficient Autophage progression.",createdAt:Date.now()-8000,objectives:[
{name:"Unlock Autophage staff access",priority:"Critical",done:false,notes:"Progress They Who Returned."},
{name:"Earn Void Motes",priority:"High",done:false,notes:"Fund staff component purchases."},

{name:"Acquire staff pole",priority:"High",done:false,notes:"Choose preferred component."},
{name:"Assemble Voltaic Staff",priority:"Medium",done:false,notes:"Assemble at an Autophage terminal."},
{name:"Upgrade and optimise Staff",priority:"Low",done:false,notes:"Improve class, modules and supercharged layout."}]},
{id:"mould",name:"Runaway Mould Nanite Farm",description:"Establish a permanent Curious Deposit Nanite farm.",priority:"High",status:"Planned",notes:"Permanent Nanite source for upgrades.",createdAt:Date.now()-7000,objectives:[
{name:"Locate Curious Deposits",priority:"Critical",done:false,notes:"Find a suitable cluster."},
{name:"Claim farm site",priority:"High",done:false,notes:"Place a Base Computer."},
{name:"Build containment walls",priority:"High",done:false,notes:"Stop mould balls escaping."},
{name:"Install teleport loop",priority:"Medium",done:false,notes:"Enable respawn cycling."},
{name:"Install refiners",priority:"Medium",done:false,notes:"Refine Runaway Mould into Nanites."},
{name:"Test repeatable harvest cycle",priority:"Low",done:false,notes:"Confirm reliable respawn and refinement."}]},
{id:"blueprints",name:"Construction Blueprints",description:"Unlock every construction blueprint.",priority:"Medium",status:"Active",notes:"Long-term completion objective.",createdAt:Date.now()-6000,objectives:[
{name:"Audit unlocked construction catalogue",priority:"High",done:false,notes:"Identify missing categories."},
{name:"Collect Salvaged Data",priority:"High",done:false,notes:"Build a blueprint currency reserve."},
{name:"Unlock core base structures",priority:"High",done:false,notes:"Complete primary structural categories."},
{name:"Unlock power and industry technology",priority:"Medium",done:false,notes:"Complete utility categories."},
{name:"Unlock decoration and specialist parts",priority:"Low",done:false,notes:"Finish remaining catalogue."}]},
{id:"specialists",name:"Base Specialist Missions",description:"Complete every workstation/base specialist mission chain.",priority:"Medium",status:"Planned",notes:"Overseer, Scientist, Armourer, Farmer and Technician chains.",createdAt:Date.now()-5000,objectives:[
{name:"Complete Overseer chain",priority:"High",done:false,notes:""},
{name:"Complete Scientist chain",priority:"High",done:false,notes:""},
{name:"Complete Armourer chain",priority:"Medium",done:false,notes:""},
{name:"Complete Farmer chain",priority:"Medium",done:false,notes:""},
{name:"Complete Technician chain",priority:"Medium",done:false,notes:""}]},
{id:"settlement",name:"Settlement Development",description:"Bring your settlement to its maximum practical potential.",priority:"High",status:"Active",notes:"Continue construction opportunities and improve settlement metrics.",createdAt:Date.now()-4000,objectives:[
{name:"Clear settlement debt",priority:"Critical",done:false,notes:""},
{name:"Keep construction opportunities active",priority:"High",done:false,notes:""},
{name:"Increase productivity",priority:"High",done:false,notes:""},
{name:"Increase citizen happiness",priority:"High",done:false,notes:""},
{name:"Expand useful settlement buildings",priority:"Medium",done:false,notes:""},
{name:"Improve settlement class",priority:"Medium",done:false,notes:""},
{name:"Reach stable maximum development",priority:"Low",done:false,notes:""}]},
{id:"corvette",name:"Corvette Development",description:"Complete and optimise your medium combat/exploration Corvette.",priority:"Medium",status:"Active",notes:"Nomad's Reach concept: forward cockpit, central spine, symmetrical weapon pods and rear engine cluster.",createdAt:Date.now()-3000,objectives:[
{name:"Collect advanced Corvette modules",priority:"High",done:false,notes:"Target 20–30+ useful modules before finalising."},
{name:"Install reactor and core systems",priority:"High",done:false,notes:""},
{name:"Install engines and shields",priority:"High",done:false,notes:""},

{name:"Build initial balanced frigate roster",priority:"High",done:false,notes:"Recruit across expedition specialities."},
{name:"Prioritise Industrial frigates",priority:"High",done:false,notes:"Useful for Salvaged Frigate Module opportunities."},
{name:"Expand Fleet Command capacity",priority:"Medium",done:false,notes:""},

{name:"Develop frigates through expeditions",priority:"Medium",done:false,notes:""},
{name:"Progress toward 30-frigate fleet",priority:"Low",done:false,notes:""}]},
{id:"station",name:"Star Station Project",description:"Prepare for, acquire and develop your own Star Station.",priority:"High",status:"Active",notes:"Ultimate NMS Command Centre objective.",createdAt:Date.now()-1000,objectives:[
{name:"Build Star Station acquisition fund",priority:"Critical",done:false,notes:"Current reserve: 120M Units. Planning target approximately 1B+."},
{name:"Continue Cosmos salvage preparation",priority:"High",done:false,notes:"Gravitino Coil acquired; Tractor Beam remains useful."},
{name:"Build local race and Guild standing",priority:"High",done:false,notes:"Prepare for Station Core requirements."},
{name:"Complete required salvage contracts",priority:"High",done:false,notes:"Requirements vary by candidate station."},
{name:"Inspect candidate Station Cores",priority:"Medium",done:false,notes:"Compare acquisition requirements."},
{name:"Acquire a Star Station",priority:"Critical",done:false,notes:"Claim an eligible unowned station."},
{name:"Develop station interior and exterior",priority:"Medium",done:false,notes:""},
{name:"Establish station as operational headquarters",priority:"Low",done:false,notes:""}]},
{id:"purge",name:"The Purge / Artemis Story",description:"Main Artemis storyline completed; green/lush galaxy selected.",priority:"Optional",status:"Complete",notes:"Completed milestone.",createdAt:Date.now()-12000,objectives:[{name:"Complete The Purge",priority:"Critical",done:true,notes:"Completed."},{name:"Choose Lush galaxy",priority:"Low",done:true,notes:"Completed."}]},
{id:"glyphs",name:"Portal Glyphs",description:"Obtain all Portal Glyphs.",priority:"Optional",status:"Complete",notes:"16/16 obtained.",createdAt:Date.now()-11000,objectives:[{name:"Obtain 16/16 Portal Glyphs",priority:"Critical",done:true,notes:"Completed."}]}
];
const defaultState={units:120000000,nanites:0,glyphs:16,frigates:0,missions:seedMissions,ships:[{name:"Embers Defender TB4",class:"A",notes:"Authenticated Starship"}],tools:[],mines:[{name:"Gold Mine",class:"S",status:"Operational"},{name:"Activated Indium Mine",class:"B",status:"Operational"}],bases:[],notes:""};
function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){try{let old=JSON.parse(localStorage.getItem(KEY)||"null");if(!old)return clone(defaultState);let s={...clone(defaultState),...old};/* migrate personalised mission seeds without deleting user-created missions */let byId=new Map((s.missions||[]).map(m=>[m.id,m]));for(const sm of seedMissions){let existing=byId.get(sm.id);if(!existing){s.missions.push(clone(sm));continue}if(!existing.objectives||existing.objectives.length===0){existing.objectives=clone(sm.objectives);existing.description=existing.description||sm.description;existing.notes=existing.notes||sm.notes}}return s}catch(e){return clone(defaultState)}}
let S=load(),view="missions",selected="returned",filter="All",search="",draft=null;
function save(){localStorage.setItem(KEY,JSON.stringify(S));render()}
function pct(m){let a=m.objectives||[];return a.length?Math.round(a.filter(o=>o.done).length/a.length*100):(m.status==="Complete"?100:0)}
function status(m){if((m.objectives||[]).length){let p=pct(m);return p===100?"Complete":p>0?"Active":(m.status||"Planned")}return m.status||"Planned"}
function cls(p){return String(p||"Medium").toLowerCase()}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function sortedObjectives(m){return [...(m.objectives||[])].sort((a,b)=>(priorityOrder[a.priority]??9)-(priorityOrder[b.priority]??9)||Number(a.done)-Number(b.done))}
function nav(){let items=[["command","DASHBOARD"],["missions","MISSIONS"],["assets","ASSETS"],["fleet","FLEET"],["empire","EMPIRE"],["knowledge","KNOWLEDGE"],["data","DATA"]];for(let id of ["desktopNav","mobileNav"]){document.getElementById(id).innerHTML=items.map(([k,l])=>`<button class="${view===k?"active":""}" onclick="view='${k}';render()">${l}</button>`).join("")}}
function missionList(){let a=S.missions.filter(m=>(filter==="All"||status(m)===filter)&&(!search||m.name.toLowerCase().includes(search.toLowerCase())));return a.map(m=>`<div class="mission ${selected===m.id?"selected":""}" onclick="selected='${m.id}';render()"><div><h3>${esc(m.name)}</h3><div class="sub">${esc(m.description||"")}</div><div class="bar"><i style="width:${pct(m)}%"></i></div><div class="sub">${(m.objectives||[]).filter(o=>o.done).length}/${(m.objectives||[]).length} objectives</div></div><span class="badge ${status(m)==="Complete"?"complete":cls(m.priority)}">${esc(status(m)==="Complete"?"Completed":m.priority)}</span></div>`).join("")}
function missions(){let m=S.missions.find(x=>x.id===selected)||S.missions[0];if(m)selected=m.id;return `<div class="grid"><section class="panel"><div class="row"><div><div class="title">MISSIONS</div><div class="sub">Plan, track and complete your No Man's Sky journey.</div></div><button class="btn primary" onclick="openEditor(null)">+ CREATE MISSION</button></div><div class="filters">${["All","Active","Complete","Planned"].map(x=>`<button class="${filter===x?"active":""}" onclick="filter='${x}';render()">${x}</button>`).join("")}</div><input class="search" placeholder="Search missions..." value="${esc(search)}" oninput="search=this.value;render()">${missionList()}</section>${m?missionDetail(m):""}</div>`}
function missionDetail(m){let objs=sortedObjectives(m);return `<section class="panel detail open"><div class="row"><div><h2>${esc(m.name)}</h2><div class="sub">${esc(m.description||"")}</div></div><div><span class="badge ${cls(m.priority)}">${esc(m.priority)}</span> <span class="badge ${status(m)==="Complete"?"complete":"low"}">${status(m)}</span></div></div><div class="bar"><i style="width:${pct(m)}%"></i></div><div class="row sub"><span>${(m.objectives||[]).filter(o=>o.done).length}/${(m.objectives||[]).length} objectives complete</span><b>${pct(m)}%</b></div><div class="tabs"><button class="active">Objectives</button><button>Notes</button><button>Related</button></div>${objs.map(o=>`<div class="objective ${o.done?"done":""}"><input type="checkbox" ${o.done?"checked":""} onchange="toggleObj('${m.id}','${esc(o.name)}',this.checked)"><div><b class="otext">${esc(o.name)}</b><div class="sub">${esc(o.notes||"")}</div></div><span class="badge ${cls(o.priority)}">${esc(o.priority)}</span></div>`).join("")}<div class="hint">Objectives automatically sort by priority: Critical → High → Medium → Low → Optional. Mission priority remains fully user-editable.</div><div class="row" style="margin-top:12px"><button class="btn danger" onclick="deleteMission('${m.id}')">DELETE MISSION</button><button class="btn primary" onclick="openEditor('${m.id}')">EDIT MISSION</button></div></section>`}
function toggleObj(mid,name,val){let m=S.missions.find(x=>x.id===mid),o=m?.objectives.find(x=>x.name===name);if(o){o.done=val;m.status=pct(m)===100?"Complete":pct(m)>0?"Active":"Planned";save()}}
function generic(title,body){return `<section class="panel"><div class="title">${title}</div>${body}</section>`}
function command(){let active=S.missions.filter(m=>status(m)==="Active").length;return generic("COMMAND DASHBOARD",`<div class="cards"><div class="card"><div class="title">${(S.units/1e6).toFixed(1)}M</div><div class="sub">UNITS</div></div><div class="card"><div class="title">${S.nanites||0}</div><div class="sub">NANITES</div></div><div class="card"><div class="title">${S.glyphs||0}/16</div><div class="sub">GLYPHS</div></div><div class="card"><div class="title">${S.frigates||0}/30</div><div class="sub">FRIGATES</div></div></div><div class="card" style="margin-top:12px"><b>ACTIVE OPERATIONS</b><div class="title">${active}</div></div>`)}
function assets(){return generic("ASSETS",`<div class="cards">${S.ships.map(x=>`<div class="card"><b>${esc(x.name)}</b><div class="sub">${esc(x.class)}-Class · ${esc(x.notes)}</div></div>`).join("")}${S.mines.map(x=>`<div class="card"><b>${esc(x.name)}</b><div class="sub">${esc(x.class)}-Class · ${esc(x.status)}</div></div>`).join("")}</div>`)}
function fleet(){return generic("FLEET",`<div class="card"><b>Freighter Command</b><div class="sub">Freighter owned. Develop frigate roster toward 30 capacity.</div></div>`)}
function empire(){return generic("EMPIRE",`<div class="cards"><div class="card"><b>Settlement</b><div class="sub">Development mission tracked in Mission Control.</div></div><div class="card"><b>Star Station Project</b><div class="sub">${(S.units/1e6).toFixed(1)}M / ~1B+ planning reserve</div></div><div class="card"><b>Gold Mine</b><div class="sub">S-Class · Operational</div></div><div class="card"><b>Activated Indium Mine</b><div class="sub">B-Class · Operational</div></div></div>`)}
function knowledge(){return generic("KNOWLEDGE CORE",`<div class="card"><b>Universal NMS Knowledge</b><div class="sub">The universal reference database remains a core NMSCC system. This rebuild preserves the section while the database continues to be expanded.</div></div>`)}
function data(){return generic("DATA",`<div class="cards"><div class="card"><label>Units</label><input class="search" type="number" value="${S.units}" onchange="S.units=+this.value;save()"></div><div class="card"><label>Nanites</label><input class="search" type="number" value="${S.nanites}" onchange="S.nanites=+this.value;save()"></div></div><div style="margin-top:12px"><button class="btn" onclick="exportData()">EXPORT JSON</button> <button class="btn" onclick="document.getElementById('imp').click()">IMPORT JSON</button><input id="imp" type="file" accept=".json" hidden onchange="importData(this.files[0])"></div>`)}
function render(){nav();let routes={command,missions,assets,fleet,empire,knowledge,data};document.getElementById("app").innerHTML=(routes[view]||missions)();document.getElementById("unitstat").textContent=(S.units/1e6).toFixed(1)+"M Units";document.getElementById("nanstat").textContent=(S.nanites||0)+" Nanites"}
function opts(v){return ["Critical","High","Medium","Low","Optional"].map(x=>`<option ${x===v?"selected":""}>${x}</option>`).join("")}
function openEditor(id){let m=id?S.missions.find(x=>x.id===id):null;draft=m?clone(m):{id:"m"+Date.now(),name:"",description:"",priority:"Medium",status:"Planned",notes:"",createdAt:Date.now(),objectives:[]};draft._editing=!!m;drawEditor()}
function drawEditor(){document.getElementById("modal")?.remove();let d=document.createElement("div");d.id="modal";d.className="modalbg";d.innerHTML=`<div class="modal"><div class="row"><div><div class="title">${draft._editing?"EDIT MISSION":"CREATE MISSION"}</div><div class="sub">${draft._editing?"Modify mission details and manage existing objectives.":"Add a new mission and set up its objectives."}</div></div><button class="btn" onclick="closeEditor()">×</button></div><div class="formgrid"><div><label class="field">MISSION NAME *</label><input id="en" value="${esc(draft.name)}"></div><div><label class="field">MISSION PRIORITY</label><select id="ep">${opts(draft.priority)}</select></div></div><label class="field">DESCRIPTION</label><textarea id="ed">${esc(draft.description)}</textarea><label class="field">MISSION NOTES</label><textarea id="enn">${esc(draft.notes)}</textarea><div class="row"><div class="title" style="font-size:17px">OBJECTIVES</div><button class="btn primary" onclick="addDraftObj()">+ ADD OBJECTIVE</button></div><div class="sub">Objective priority is assigned automatically from its position/dependency. You can reorder objectives; NMSCC sorts the saved list by priority.</div><div id="eobjs">${draftObjs()}</div><div class="actions">${draft._editing?`<button class="btn danger" onclick="deleteMission('${draft.id}')">DELETE MISSION</button>`:""}<button class="btn" onclick="closeEditor()">CANCEL</button><button class="btn primary" onclick="saveEditor()">${draft._editing?"SAVE CHANGES":"CREATE MISSION"}</button></div></div>`;document.body.appendChild(d)}
function autoPriority(i,n){if(i===0)return"Critical";if(i<Math.ceil(n*.45))return"High";if(i<Math.ceil(n*.75))return"Medium";return"Low"}
function draftObjs(){let n=draft.objectives.length;draft.objectives.forEach((o,i)=>{if(!o._locked)o.priority=autoPriority(i,n)});return draft.objectives.map((o,i)=>`<div class="objedit"><input value="${esc(o.name)}" placeholder="Objective" oninput="draft.objectives[${i}].name=this.value"><span class="badge ${cls(o.priority)}">${o.priority}</span><button class="btn del danger" onclick="draft.objectives.splice(${i},1);drawEditor()">DELETE</button><input style="grid-column:1/-1" value="${esc(o.notes||"")}" placeholder="Objective notes" oninput="draft.objectives[${i}].notes=this.value"><div style="grid-column:1/-1"><button class="btn" onclick="moveDraft(${i},-1)">↑</button> <button class="btn" onclick="moveDraft(${i},1)">↓</button></div></div>`).join("")||`<div class="hint">No objectives yet. Add your first objective to get started.</div>`}
function syncEditor(){if(!draft)return;let g=x=>document.getElementById(x);draft.name=g("en")?.value||draft.name;draft.priority=g("ep")?.value||draft.priority;draft.description=g("ed")?.value||"";draft.notes=g("enn")?.value||""}
function addDraftObj(){syncEditor();draft.objectives.push({name:"",notes:"",done:false,priority:"Low"});drawEditor()}
function moveDraft(i,d){syncEditor();let j=i+d;if(j<0||j>=draft.objectives.length)return;[draft.objectives[i],draft.objectives[j]]=[draft.objectives[j],draft.objectives[i]];drawEditor()}
function saveEditor(){syncEditor();if(!draft.name.trim())return alert("Enter a mission name.");draft.objectives=draft.objectives.filter(o=>o.name.trim());draft.objectives.forEach((o,i)=>o.priority=autoPriority(i,draft.objectives.length));let edit=draft._editing;delete draft._editing;if(edit){let i=S.missions.findIndex(x=>x.id===draft.id);S.missions[i]=draft}else S.missions.unshift(draft);selected=draft.id;draft=null;document.getElementById("modal")?.remove();save()}
function closeEditor(){draft=null;document.getElementById("modal")?.remove()}
function deleteMission(id){if(!confirm("Delete this mission?"))return;S.missions=S.missions.filter(x=>x.id!==id);selected=S.missions[0]?.id;closeEditor();save()}
function exportData(){let b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="NMSCC-backup.json";a.click();URL.revokeObjectURL(a.href)}
function importData(f){if(!f)return;let r=new FileReader;r.onload=()=>{try{S={...clone(defaultState),...JSON.parse(r.result)};save()}catch(e){alert("Invalid NMSCC backup.")}};r.readAsText(f)}
render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
